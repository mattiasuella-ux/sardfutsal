  # =====================================================
  # RISULTATI E CALENDARIO
  # =====================================================

  - name: matches
    label: Risultati & Calendario
    type: collection
    path: content/matches
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:

      - name: date
        label: Data
        type: date
        required: true

      - name: time
        label: Ora
        type: string

      - name: competition
        label: Competizione
        type: string
        required: true

      - name: opponent
        label: Avversario
        type: string
        required: true

      - name: venue
        label: Campo / Palazzetto
        type: string

      - name: home_away
        label: Casa / Trasferta
        type: select
        required: true
        options:
          values:
            - Casa
            - Trasferta

      - name: sard_goals
        label: Gol Sard Futsal
        type: number
        default: -1

      - name: opponent_goals
        label: Gol avversario
        type: number
        default: -1

      - name: scorers_home
        label: Marcatori Casa
        type: text

      - name: scorers_away
        label: Marcatori Trasferta
        type: text

      - name: home_logo
        label: Logo squadra di casa
        type: image

      - name: away_logo
        label: Logo squadra ospite
        type: image

    view:
      fields:
        - date
        - opponent
        - competition
        - home_away
        - venue

      primary: opponent

      sort:
        - date

      default:
        sort: date
        order: desc
