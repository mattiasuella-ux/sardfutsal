media: images

content:

  # =====================================================
  # NEWS
  # =====================================================

  - name: news
    label: News
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:

      - name: title
        label: Titolo
        type: string
        required: true

      - name: category
        label: Categoria
        type: string
        required: true

      - name: date
        label: Data
        type: date
        required: true

      - name: image
        label: Immagine
        type: image

      - name: image_position
        label: Posizione della foto
        type: select
        description: "Sceglie quale parte della foto resta visibile quando viene ritagliata (nella card e nella notizia)."
        default: "50% 50%"
        options:
          values:
            - value: "50% 50%"
              label: Centro
            - value: "50% 0%"
              label: In alto
            - value: "50% 100%"
              label: In basso
            - value: "0% 50%"
              label: A sinistra
            - value: "100% 50%"
              label: A destra
            - value: "0% 0%"
              label: In alto a sinistra
            - value: "100% 0%"
              label: In alto a destra
            - value: "0% 100%"
              label: In basso a sinistra
            - value: "100% 100%"
              label: In basso a destra
            - value: "50% 25%"
              label: Un po' in alto (volti)

      - name: excerpt
        label: Anteprima
        type: text

      - name: body
        label: Contenuto
        type: text
        description: "Lascia una riga vuota tra un paragrafo e l'altro (Invio due volte). Per il grassetto scrivi **così** tra due asterischi."

    view:
      fields:
        - title
        - category
        - date

      primary: title

      sort:
        - date

      default:
        sort: date
        order: desc


  # =====================================================
  # ROSA
  # =====================================================

  - name: players
    label: Rosa
    type: collection
    path: content/players
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:

      - name: name
        label: Nome giocatore
        type: string
        required: true

      - name: number
        label: Numero di maglia
        type: number

      - name: role
        label: Ruolo
        type: string
        required: true

      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - Portiere
            - Giocatore di movimento

      - name: image
        label: Foto
        type: image

    view:
      fields:
        - name
        - number
        - role
        - category

      primary: name

      sort:
        - number

      default:
        sort: number
        order: asc


  # =====================================================
  # CALENDARIO STAGIONE (un solo elenco con tutte le partite)
  # =====================================================

  - name: calendario
    label: Calendario stagione
    type: file
    path: content/calendario.yml
    format: yaml

    fields:

      - name: partite
        label: Partite
        type: object
        list: true
        description: "Aggiungi qui tutte le partite della stagione. Quando una partita è finita, apri la riga, cambia lo stato in Terminata e inserisci gol e marcatori."

        fields:

          - name: date
            label: Data
            type: date
            required: true

          - name: time
            label: Ora (es. 21:30)
            type: string

          - name: competition
            label: Competizione
            type: string
            required: true

          - name: opponent
            label: Avversario
            type: string
            required: true

          - name: venue
            label: Campo / Palazzetto
            type: string

          - name: home_away
            label: Casa / Trasferta
            type: select
            required: true
            options:
              values:
                - Casa
                - Trasferta

          - name: status
            label: Stato partita
            type: select
            required: true
            options:
              values:
                - Da giocare
                - Terminata

          - name: sard_goals
            label: Gol Sard Futsal
            type: number

          - name: opponent_goals
            label: Gol avversario
            type: number

          - name: scorers_home
            label: Marcatori squadra di casa
            type: text
            description: "Uno per riga. Se un giocatore segna più gol scrivi il nome più volte (o 'Rossi x2'): sul sito compare una volta con tanti palloni quanti i gol."

          - name: scorers_away
            label: Marcatori squadra ospite
            type: text

          - name: home_logo
            label: Logo squadra di casa
            type: image

          - name: away_logo
            label: Logo squadra ospite
            type: image


  # =====================================================
  # RISULTATI E CALENDARIO
  # =====================================================

  - name: matches
    label: Risultati & Calendario
    type: collection
    path: content/matches
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:

      - name: date
        label: Data
        type: date
        required: true

      - name: time
        label: Ora
        type: string

      - name: competition
        label: Competizione
        type: string
        required: true

      - name: opponent
        label: Avversario
        type: string
        required: true

      - name: venue
        label: Campo / Palazzetto
        type: string

      - name: home_away
        label: Casa / Trasferta
        type: select
        required: true
        options:
          values:
            - Casa
            - Trasferta
            
      - name: status
        label: Stato partita
        type: select
        required: true
        options:
          values:
            - Da giocare
            - Terminata
            - Calendario in aggiornamento

      - name: sard_goals
        label: Gol Sard Futsal
        type: number

      - name: opponent_goals
        label: Gol avversario
        type: number
        
      - name: scorers_home
        label: Marcatori Casa
        type: text

      - name: scorers_away
        label: Marcatori Trasferta
        type: text

      - name: home_logo
        label: Logo squadra di casa
        type: image

      - name: away_logo
        label: Logo squadra ospite
        type: image

    view:
      fields:
        - date
        - opponent
        - competition
        - status
        - home_away
        - venue

      primary: opponent

      sort:
        - date

      default:
        sort: date
        order: desc

  # =====================================================
  # SPONSOR
  # =====================================================

  - name: sponsors
    label: Sponsor
    type: collection
    path: content/sponsors
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:

      - name: name
        label: Nome sponsor
        type: string
        required: true

      - name: logo
        label: Logo
        type: image
        required: true

      - name: website
        label: Sito web
        type: string

      - name: order
        label: Ordine
        type: number

    view:
      fields:
        - name
        - order

      primary: name

      sort:
        - order

      default:
        sort: order
        order: asc

# Fine configurazione
